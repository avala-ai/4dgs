[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourdgs"
version = "0.6.0"
description = "Reader and writer for the 4dgs container format for 4D gaussian splat scenes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Avala AI" }]
keywords = ["gaussian-splatting", "4d", "container-format", "volumetric-video"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]
# OpenUSD interop (the `4dgs from-usd` / `to-usd` commands) needs the reference USD
# runtime. It is heavy, so it is an optional extra: the core package stays lean and the
# USD commands gate on its presence with a clear "install fourdgs[usd]" message. Pinned to
# a lower bound at OpenUSD 26.03, the release that shipped the ParticleField3DGaussianSplat
# schema this bridge targets.
usd = ["usd-core>=26.3"]
dev = ["pytest>=8", "ruff==0.16.5"]

[project.scripts]
fourdgs = "fourdgs.cli:main"

[project.urls]
Homepage = "https://4dgs.dev"
Repository = "https://github.com/avala-ai/4dgs"
Specification = "https://4dgs.dev/docs/spec/"

[tool.setuptools.packages.find]
include = ["fourdgs*"]

# Lint configuration lives in the repository root's ruff.toml so every
# invocation — here, from the root, or in CI — applies the same rules.
