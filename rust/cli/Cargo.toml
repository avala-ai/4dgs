[package]
name = "fourdgs-cli"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Command line tool for the 4dgs container format"
homepage = "https://4dgs.dev"
repository = "https://github.com/avala-ai/4dgs"
# The core is published; this is not, and the reason is specific rather than a policy.
# crates.io trusted publishing is configured per crate, and a crate has to exist before
# a publisher can be attached to it — `fourdgs-cli` does not, so the release job has no
# way to authenticate for it and would fall back to a stored token, which this repository
# does not have and should not acquire. Claiming the name and attaching a publisher is
# the prerequisite; until then the tool is `cargo install --git` or a build from source.
publish = false

# The tool is `4dgs` everywhere a user types it. The crate is `fourdgs-cli` because
# crates.io refuses a name beginning with a digit — a registry constraint, not a rename.
# RELEASING.md's naming table records the same thing for every registry.
[[bin]]
name = "4dgs"
path = "src/main.rs"

# Nothing but the library. A format repository's tool that pulls a dependency tree wider
# than the format's own is a tool nobody can audit, so the argument parser is the fifty
# lines in `args.rs` rather than a crate.
[dependencies]
fourdgs = { path = "../fourdgs" }
