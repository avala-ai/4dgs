[package]
name = "fourdgs-conformance"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Conformance runners for the 4dgs Rust SDK"
homepage = "https://4dgs.dev"
repository = "https://github.com/avala-ai/4dgs"
publish = false

# Two runners, invoked by tests/conformance/run.py with a path and expected to print the
# canonical JSON to stdout. That is the whole interface between an SDK and the harness.
[[bin]]
name = "decode_streamed"
path = "src/bin/decode_streamed.rs"

[[bin]]
name = "decode_indexed"
path = "src/bin/decode_indexed.rs"

[dependencies]
fourdgs = { path = "../fourdgs" }

[[bin]]
name = "encode_roundtrip"
path = "src/bin/encode_roundtrip.rs"

# The shared encode reference for the cross-language gate. It re-encodes a variant's
# gaussians alone, with a fixed option preset, so the C++, Swift and TypeScript encoders can
# be diffed against one baseline that carries no extras they cannot reproduce.
[[bin]]
name = "encode_gaussians"
path = "src/bin/encode_gaussians.rs"
