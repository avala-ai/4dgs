name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/website.yml"
  # A pull request builds but does not deploy, so a broken link or a failing build is
  # caught before it reaches main rather than after the deploy job has already run.
  pull_request:
    paths:
      - "website/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # The package manager is the one the root package.json declares, and the website is
      # one of its workspaces.
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      # `onBrokenLinks: throw` makes this the link check too: a relative link between docs
      # that no longer resolves fails here rather than shipping as a 404.
      - name: Build
        run: yarn workspace website build

      # The viewer decodes real `.4dgs` files, so its tests need the corpus the six SDKs are
      # diffed against. It is generated rather than committed; the tests fail rather than
      # skip when it is absent, so this step is not optional.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate the conformance corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      # Both halves run against what was just built: the decode tests drive the viewer's
      # own decode layer over every corpus variant, and the browser tests drive the built
      # site in the Chrome this runner image already carries.
      - name: Test the viewer
        run: yarn workspace website test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    # Only main deploys. A pull request has already proved the site builds by this point.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
