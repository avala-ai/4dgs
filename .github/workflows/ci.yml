name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  size-budget:
    # The repository stays small enough to clone without thinking about it. Sub-budgets
    # are in the skeleton brief; this gate is the total.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Total tree size under 8 MB
        run: |
          size_kb=$(du -s --exclude=.git . | cut -f1)
          echo "tree: ${size_kb} KiB"
          if [ "$size_kb" -gt 8192 ]; then
            echo "::error::tree is ${size_kb} KiB, over the 8192 KiB budget"
            exit 1
          fi
      - name: Conformance data under 2.5 MB
        run: |
          if [ -d tests/conformance/data ]; then
            size_kb=$(du -s tests/conformance/data | cut -f1)
            echo "conformance data: ${size_kb} KiB"
            [ "$size_kb" -le 2560 ] || { echo "::error::conformance data over budget"; exit 1; }
          fi
      - name: Rust sources under 500 KB
        # Sources only: this job builds nothing, so target/ is not here to measure. A
        # vendored dependency would show up as a budget failure, which is the point —
        # everything this crate needs comes from crates.io via Cargo.toml.
        run: |
          size_kb=$(du -s rust | cut -f1)
          echo "rust: ${size_kb} KiB"
          [ "$size_kb" -le 500 ] || { echo "::error::rust is ${size_kb} KiB, over the 500 KiB budget"; exit 1; }

      - name: TypeScript sources under 500 KB
        # Sources only: this job installs nothing and builds nothing, so node_modules
        # and dist are not here to measure. A vendored dependency would show up as a
        # budget failure, which is the point.
        run: |
          size_kb=$(du -s typescript | cut -f1)
          echo "typescript: ${size_kb} KiB"
          [ "$size_kb" -le 500 ] || { echo "::error::typescript is ${size_kb} KiB, over the 500 KiB budget"; exit 1; }
      - name: Swift sources under 300 KB
        # Sources only, same as TypeScript's: this job builds nothing, so .build is not
        # here to measure and a vendored dependency would show up as a budget failure.
        run: |
          size_kb=$(du -s swift | cut -f1)
          echo "swift: ${size_kb} KiB"
          [ "$size_kb" -le 300 ] || { echo "::error::swift is ${size_kb} KiB, over the 300 KiB budget"; exit 1; }

  no-committed-binaries:
    # The corpus is generated. A committed .4dgs means someone bypassed the generator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git ls-files '*.4dgs' | grep -q .; then
            echo "::error::.4dgs files must not be committed; the generator reconstructs them"
            git ls-files '*.4dgs'
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The dev extra brings pytest and ruff, so the job installs what it runs
      # rather than assuming the runner already has it.
      - run: pip install -e './python/fourdgs[dev]'
      # Rules and line length come from the root ruff.toml, so this command is
      # the same one a contributor runs locally.
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests
        run: python -m pytest python/fourdgs/tests -q

      - name: Examples run, so they cannot rot into snippets that no longer work
        run: |
          cd python/fourdgs && python ../examples/encode_synthetic.py && python ../examples/decode_summary.py

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npx --yes prettier@3 --check "**/*.md"
      - run: npx --yes cspell@8 --config cspell.config.yaml "**/*.md"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # The package manager is the one the root package.json declares.
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Format
        run: npx --yes prettier@3 --check "typescript/**/*.ts"

      # `tsc -b` is the typecheck: the packages are project references, so this also
      # proves they build in dependency order from a clean tree.
      - name: Typecheck and build
        run: yarn build

      # The unit tests decode real corpus files, which are generated rather than
      # committed. Generating them first is what stops those tests skipping themselves
      # into a green run that proved nothing — and the skip count is asserted below.
      - name: Corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      - name: Tests
        shell: bash
        run: |
          node --test typescript/conformance/dist/*.test.js | tee test.log
          grep -q '^# skipped 0' test.log || {
            echo "::error::some tests skipped; they must all run in CI"
            exit 1
          }

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace

      # These cover what the corpus cannot: a file that is not ours, a version we do not
      # implement, a record we have never seen, a length that points past the end.
      - name: Tests
        run: cargo test --workspace

      # The optional codec has to keep compiling, or it rots until the first person who
      # needs it finds out.
      - name: The zstd feature builds
        run: cargo build -p fourdgs --features zstd

      # The C++ and Swift packages bind to include/fourdgs.h, so a drift between that
      # header and the symbols the library exports is their outage. This compiles a C
      # program against both and runs it, which is the only check that catches it here.
      - name: The C ABI links and behaves
        run: |
          cargo build -p fourdgs --release
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          cc -Wall -Wextra -Werror -std=c11 -I rust/fourdgs/include \
            rust/fourdgs/tests/capi_smoke.c -o capi_smoke \
            target/release/libfourdgs.a -lm -lpthread -ldl
          for variant in \
            OneWindow-UseChunkIndex-UseCrc-WithAudio \
            OneWindow-UseChunkIndex-UseCrc-WithLargeAudio \
            MixedLifetimes-SHDegree2-UseChunkIndex-UseCrc \
            NoData-UseChunkIndex-UseCrc \
            TenWindows-UseCrc; do
            ./capi_smoke "tests/conformance/data/$variant.4dgs"
          done

  cpp:
    # Both supported configurations are built, because both ship: with the Rust core linked,
    # and without one. The no-core build is not a placeholder — it is what an integrator gets
    # before they have built the crate, and its tests assert that every call refuses with
    # kNotImplemented rather than quietly decoding nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Pinned, because clang-format's output changes between releases and an unpinned
      # formatter is a gate that fails on somebody else's upgrade.
      - name: Format
        run: |
          pip install clang-format==22.1.8
          clang-format --dry-run --Werror $(git ls-files 'cpp/*.cpp' 'cpp/*.hpp')

      - name: Build and test without a core
        run: |
          cmake -S cpp -B cpp/build-nocore -DCMAKE_BUILD_TYPE=Debug \
            -DFOURDGS_CORE_HEADER_DIR=/nonexistent
          cmake --build cpp/build-nocore -j
          ctest --test-dir cpp/build-nocore --output-on-failure

      - name: Build and test against the core
        run: |
          cargo build -p fourdgs --release
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build cpp/build -j
          ctest --test-dir cpp/build --output-on-failure

      # The binding owns handles that come from across an FFI boundary, so a leak and a read
      # past the end of a buffer the ABI handed over are the two bugs it is exposed to. The
      # runners decode a real file here rather than the tests' synthetic data, because an
      # open/decode/close cycle over a real one is what the sanitizers need to see.
      - name: Sanitizers
        run: |
          cmake -S cpp -B cpp/build-asan -DCMAKE_BUILD_TYPE=Debug -DFOURDGS_ASAN=ON
          cmake --build cpp/build-asan -j
          ctest --test-dir cpp/build-asan --output-on-failure
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          # This step gates on memory, not on decoding: a sanitizer report exits 99 and fails
          # the job, while a decoder refusing a file exits 1 and is the conformance job's
          # business. Conflating the two would either hide a leak or make this job red for a
          # reason it cannot diagnose.
          for f in tests/conformance/data/*.4dgs; do
            ./cpp/build-asan/conformance/decode_streamed "$f" > /dev/null || {
              [ "$?" -eq 99 ] && { echo "::error::sanitizer report decoding $f"; exit 1; }
            }
          done
        env:
          ASAN_OPTIONS: detect_leaks=1:exitcode=99

  swift:
    # The official Swift image rather than a toolchain-installer action: the job installs
    # nothing, and the version it builds against is a line in this file.
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Style comes from swift/.swift-format, so this is the same command a contributor
      # runs locally: `swift format --in-place --recursive` fixes what this reports.
      - name: Format
        run: swift format lint --recursive --strict swift/Sources swift/Tests swift/conformance
      - name: Build
        run: swift build --package-path swift
      - name: Tests
        run: swift test --package-path swift

      # The canonical JSON is a contract between languages, and this is where Swift's half
      # of it is checked — against canonical.py, on a synthetic scene, with no decoding in
      # the way. Doing it now means that when the C ABI lands, a conformance mismatch is
      # about the decode and nothing else.
      - name: Canonical JSON agrees with canonical.py
        run: |
          apt-get update -qq && apt-get install -y -qq python3-numpy >/dev/null
          swift run --package-path swift canonical_selftest > /tmp/swift.json
          python3 swift/conformance/selftest.py --compare /tmp/swift.json

  swift-darwin:
    # visionOS and iOS are the platforms this package exists for, and a Linux build proves
    # nothing about either. The macOS runner is where the platform declarations in
    # Package.swift are actually checked against an SDK.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build for macOS
        run: swift build --package-path swift
      - name: Build for visionOS and iOS
        working-directory: swift
        run: |
          for platform in visionOS iOS; do
            echo "::group::$platform"
            xcodebuild -scheme FourDGS -destination "generic/platform=$platform" \
              -skipPackagePluginValidation build | tail -5
            echo "::endgroup::"
          done
