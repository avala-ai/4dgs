name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  size-budget:
    # The repository stays small enough to clone without thinking about it. Sub-budgets
    # are in the skeleton brief; this gate is the total.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Total tree size under 8 MB
        run: |
          size_kb=$(du -s --exclude=.git . | cut -f1)
          echo "tree: ${size_kb} KiB"
          if [ "$size_kb" -gt 8192 ]; then
            echo "::error::tree is ${size_kb} KiB, over the 8192 KiB budget"
            exit 1
          fi
      - name: Conformance data under 2.5 MB
        run: |
          if [ -d tests/conformance/data ]; then
            size_kb=$(du -s tests/conformance/data | cut -f1)
            echo "conformance data: ${size_kb} KiB"
            [ "$size_kb" -le 2560 ] || { echo "::error::conformance data over budget"; exit 1; }
          fi
      - name: Rust sources under 640 KB
        # Sources only: this job builds nothing, so target/ is not here to measure. A
        # vendored dependency would show up as a budget failure, which is the point —
        # everything these crates need comes from crates.io via Cargo.toml.
        #
        # 500 when `rust/` was the core and the conformance runners; 600 when the `4dgs`
        # tool became a third crate beside them; 640 after the provenance records and the
        # per-band SH bit depths, which left 596 KiB of tree against a 600 KiB ceiling —
        # a budget with four kilobytes of headroom stops being a budget and starts being
        # a tax on the next feature. The number moves when the tree grows deliberately,
        # which is the one thing it is not meant to catch.
        run: |
          size_kb=$(du -s rust | cut -f1)
          echo "rust: ${size_kb} KiB"
          [ "$size_kb" -le 640 ] || { echo "::error::rust is ${size_kb} KiB, over the 640 KiB budget"; exit 1; }

      - name: TypeScript sources under 500 KB
        # Sources only: this job installs nothing and builds nothing, so node_modules
        # and dist are not here to measure. A vendored dependency would show up as a
        # budget failure, which is the point.
        run: |
          size_kb=$(du -s typescript | cut -f1)
          echo "typescript: ${size_kb} KiB"
          [ "$size_kb" -le 500 ] || { echo "::error::typescript is ${size_kb} KiB, over the 500 KiB budget"; exit 1; }
      - name: Dart sources under 300 KB
        # Sources only, same as TypeScript's and Swift's: this job builds nothing, so
        # .dart_tool and the compiled runners are not here to measure, and a vendored
        # dependency would show up as a budget failure.
        run: |
          size_kb=$(du -s dart | cut -f1)
          echo "dart: ${size_kb} KiB"
          [ "$size_kb" -le 300 ] || { echo "::error::dart is ${size_kb} KiB, over the 300 KiB budget"; exit 1; }
      - name: Swift sources under 300 KB
        # Sources only, same as TypeScript's: this job builds nothing, so .build is not
        # here to measure and a vendored dependency would show up as a budget failure.
        run: |
          size_kb=$(du -s swift | cut -f1)
          echo "swift: ${size_kb} KiB"
          [ "$size_kb" -le 300 ] || { echo "::error::swift is ${size_kb} KiB, over the 300 KiB budget"; exit 1; }

  no-committed-binaries:
    # The corpus is generated. A committed .4dgs means someone bypassed the generator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git ls-files '*.4dgs' | grep -q .; then
            echo "::error::.4dgs files must not be committed; the generator reconstructs them"
            git ls-files '*.4dgs'
            exit 1
          fi

  python:
    # The ubuntu leg keeps the bare job name so anything referring to `python` by name
    # still finds it; the other legs are suffixed. Same trick in every matrixed job below.
    name: ${{ matrix.os == 'ubuntu-latest' && 'python' || format('python ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure and a macOS failure are different bugs, and cancelling one
      # because the other went red costs a round of CI to learn the second one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        # windows-latest defaults to pwsh, where the quoting below means something else.
        # One declaration here rather than `shell: bash` on every step.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The dev extra brings pytest and ruff, so the job installs what it runs
      # rather than assuming the runner already has it.
      - run: pip install -e './python/fourdgs[dev]'
      # Rules and line length come from the root ruff.toml, so this command is
      # the same one a contributor runs locally. Lint reads source and nothing else,
      # so running it four times would report the same answer four times.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff check .
          ruff format --check .
      # The fuzzer mutates real corpus files, so the corpus has to exist before
      # the suite runs. It fails rather than skips without one: a fuzz run that
      # quietly tested nothing is worse than no fuzz run.
      - name: Corpus
        run: python tests/conformance/generate.py
      - name: Tests
        run: python -m pytest python/fourdgs/tests -q

      - name: Examples run, so they cannot rot into snippets that no longer work
        run: |
          cd python/fourdgs && python ../examples/encode_synthetic.py && python ../examples/decode_summary.py

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npx --yes prettier@3 --check "**/*.md"
      - run: npx --yes cspell@8 --config cspell.config.yaml "**/*.md"

  typescript:
    name: ${{ matrix.os == 'ubuntu-latest' && 'typescript' || format('typescript ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # The package manager is the one the root package.json declares.
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      # Formatting is a property of the source, not of the machine reading it.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes prettier@3 --check "typescript/**/*.ts"

      # `tsc -b` is the typecheck: the packages are project references, so this also
      # proves they build in dependency order from a clean tree.
      - name: Typecheck and build
        run: yarn build

      # The unit tests decode real corpus files, which are generated rather than
      # committed. Generating them first is what stops those tests skipping themselves
      # into a green run that proved nothing — and the skip count is asserted below.
      - name: Corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      - name: Tests
        shell: bash
        run: |
          node --test typescript/conformance/dist/*.test.js | tee test.log
          grep -q '^# skipped 0' test.log || {
            echo "::error::some tests skipped; they must all run in CI"
            exit 1
          }

  fuzz:
    # The invariant: for any input at all, a decoder either succeeds or raises the
    # format's own error type. Both languages, the same mutations, the same seeds —
    # a crash found by one is handed to the other as two integers.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Corpus and build
        # `dev` brings pytest; `zstd` is not optional here even though it is for the
        # package. A corrupt codec byte can select zstd on any file, and without the
        # decompressor that input is refused as an unsupported codec before it ever
        # reaches the code that has to survive a corrupt zstd frame — the fuzzer would
        # pass by never running the branch one of its recorded crashes lives in.
        run: |
          pip install -e './python/fourdgs[dev,zstd]'
          python tests/conformance/generate.py
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Python
        run: python -m pytest python/fourdgs/tests/test_fuzz.py -q
        env:
          FOURDGS_FUZZ_ITERATIONS: "15000"

      # Under an address-space ceiling, because "never unbounded allocation" is part of
      # the invariant and it cannot be checked on a machine with enough memory to satisfy
      # the allocation. The window-table bug proved that: a 64 GB request from a four-byte
      # record succeeded quietly on a developer's box and only failed here. 1.5 GB is far
      # more than any corpus file needs and far less than a bug like that asks for.
      - name: TypeScript
        run: |
          ulimit -v 1500000
          node --test typescript/conformance/dist/fuzz.test.js
        env:
          FOURDGS_FUZZ_ITERATIONS: "8000"

  browser:
    # Two things no Node test can reach: the browser's own DecompressionStream
    # inflating these streams, and HttpRangeReadable against a server that really
    # answers 206. Chrome is driven over the DevTools protocol with the WebSocket
    # client Node already has — no browser-automation dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Corpus and build
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Decode in Chrome
        run: node typescript/conformance/dist/browser_smoke.js

  rust:
    name: ${{ matrix.os == 'ubuntu-latest' && 'rust' || format('rust ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: rustup component add rustfmt clippy

      # rustfmt and clippy read source, not the machine. One leg is the whole answer.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace

      # The CLI's tests decode real corpus files, which are generated rather than committed.
      # They skip themselves without one, which is right for a contributor and wrong here,
      # so the suite asserts the corpus exists whenever CI is set — and this is the step
      # that makes that assertion pass rather than fail.
      - name: Corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      # These cover what the corpus cannot: a file that is not ours, a version we do not
      # implement, a record we have never seen, a length that points past the end.
      #
      # The structural fuzz test runs here too, and the debug build is the point rather
      # than an accident: an integer overflow is a panic in debug and a silent wrap in
      # release, and a wrapped offset is exactly the kind of bug this is looking for. It
      # is around 45,000 decodes and takes well under a minute.
      - name: Tests, including the structural fuzz pass
        run: cargo test --workspace

      # The tool as a user meets it: four commands, real files, exit codes asserted. The
      # crate's own tests already check the fields it prints; what this adds is that the
      # binary is named `4dgs`, runs on this platform, and answers 2 rather than 0 for a
      # file it has a warning about — the parts of a CLI that only exist once it is one.
      - name: The CLI runs over the corpus
        run: |
          set -eo pipefail
          # Chosen by the properties the assertions below are about, not by filename. The
          # corpus is generated and grows; a name literal here would either rot into a
          # broken step or, worse, into one that quietly stopped covering anything.
          indexed=$(ls tests/conformance/data/*SHDegree2*UseChunkIndex*UseCrc*.4dgs | sort | head -1)
          unindexed=$(ls tests/conformance/data/*.4dgs | grep -v UseChunkIndex | sort | head -1)
          for f in "$indexed" "$unindexed"; do
            [ -n "$f" ] || { echo "::error::no corpus variant matches; the corpus was renamed"; exit 1; }
          done
          echo "indexed: $indexed"
          echo "unindexed: $unindexed"
          if [ "$RUNNER_OS" = "Windows" ]; then cli=target/debug/4dgs.exe; else cli=target/debug/4dgs; fi
          # Degree 2 because the file was picked for `SHDegree2`, so the selector and the
          # assertion cannot drift apart.
          "$cli" info "$indexed" | grep -q '^spherical harm degree 2$'
          "$cli" inspect "$indexed" | grep -q 'Footer'
          "$cli" inspect --json "$indexed" | grep -q '"trailing_magic": true'
          # The gaussian count comes from `info` rather than a literal, so this asserts the
          # two commands agree about the file instead of asserting one variant's size.
          declared=$("$cli" info "$indexed" | sed -n 's/^gaussians  *//p' | tr -d ',')
          "$cli" decode "$indexed" --time 4 --json | grep -q "\"total\": $declared"
          "$cli" validate "$indexed"
          # A file with no index is valid, says so, and exits 2 rather than 0 — which is
          # the whole reason the warning has a code of its own.
          set +e
          "$cli" validate "$unindexed"
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "::error::a file with no index must exit 2, got $code"; exit 1; }

      # The optional codec has to keep compiling, or it rots until the first person who
      # needs it finds out.
      - name: The zstd feature builds
        run: cargo build -p fourdgs --features zstd

      # The C++ and Swift packages bind to include/fourdgs.h, so a drift between that
      # header and the symbols the library exports is their outage. This compiles a C
      # program against both and runs it, which is the only check that catches it here.
      #
      # Not on Windows, and that is a scope decision rather than a gap. Reaching cl.exe
      # from a plain shell means driving vcvarsall by hand, and the drift this step looks
      # for is already caught on Windows by the cpp job, which compiles the same header
      # and links the same fourdgs.lib under MSVC. Two ways to run one check is not worth
      # a hand-rolled toolchain bootstrap.
      - name: The C ABI links and behaves
        if: runner.os != 'Windows'
        run: |
          cargo build -p fourdgs --release
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          # A Rust staticlib pulls in the platform's runtime. On Linux that is three
          # explicit libraries; on macOS they all live in libSystem, which is linked
          # anyway, and naming them is an error rather than a no-op.
          if [ "$RUNNER_OS" = "macOS" ]; then
            runtime=""
          else
            runtime="-lm -lpthread -ldl"
          fi
          cc -Wall -Wextra -Werror -std=c11 -I rust/fourdgs/include \
            rust/fourdgs/tests/capi_smoke.c -o capi_smoke \
            target/release/libfourdgs.a $runtime
          for variant in \
            OneWindow-UseChunkIndex-UseCrc-WithAudio \
            OneWindow-UseChunkIndex-UseCrc-WithLargeAudio \
            MixedLifetimes-SHDegree2-UseChunkIndex-UseCrc \
            NoData-UseChunkIndex-UseCrc \
            TenWindows-UseCrc; do
            ./capi_smoke "tests/conformance/data/$variant.4dgs"
          done

  cpp:
    # Both supported configurations are built, because both ship: with the Rust core linked,
    # and without one. The no-core build is not a placeholder — it is what an integrator gets
    # before they have built the crate, and its tests assert that every call refuses with
    # kNotImplemented rather than quietly decoding nothing.
    name: ${{ matrix.os == 'ubuntu-latest' && 'cpp' || format('cpp ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    # A ceiling, not an estimate: the job runs in about a minute. It is here because a
    # Windows executable that cannot find a DLL it imports blocks on an error dialog
    # instead of exiting, and an unbounded job turns that into six hours of a runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    env:
      # Debug everywhere but Windows, where it cannot be. Rust's *-pc-windows-msvc
      # staticlib is compiled against the release CRT (/MD); an MSVC Debug build asks for
      # /MDd, and the linker refuses the mixture with LNK2038 rather than producing
      # something that half works. Forcing the C++ side onto /MD while keeping Debug
      # would link a release CRT into a debug binary — the same mixture, unreported.
      # Release on Windows is the configuration that is actually consistent.
      #
      # `--config` and `--build-config` are no-ops for single-config generators, so the
      # same three commands serve every leg.
      FOURDGS_CMAKE_CONFIG: ${{ matrix.os == 'windows-latest' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Pinned, because clang-format's output changes between releases and an unpinned
      # formatter is a gate that fails on somebody else's upgrade. Style is a property of
      # the source, so one leg answers for all four.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install clang-format==22.1.8
          clang-format --dry-run --Werror $(git ls-files 'cpp/*.cpp' 'cpp/*.hpp')

      # The unit tests decode real corpus files, which are generated rather than committed.
      # Generating them first is what stops those tests skipping themselves into a green run
      # that proved nothing — a missing corpus fails test_decode rather than passing it.
      - name: Corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      - name: Build and test without a core
        run: |
          cmake -S cpp -B cpp/build-nocore -DCMAKE_BUILD_TYPE="$FOURDGS_CMAKE_CONFIG" \
            -DFOURDGS_CORE_HEADER_DIR=/nonexistent
          cmake --build cpp/build-nocore --config "$FOURDGS_CMAKE_CONFIG" -j
          ctest --test-dir cpp/build-nocore --build-config "$FOURDGS_CMAKE_CONFIG" \
            --output-on-failure --timeout 120

      - name: Build and test against the core
        run: |
          cargo build -p fourdgs --release
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE="$FOURDGS_CMAKE_CONFIG"
          cmake --build cpp/build --config "$FOURDGS_CMAKE_CONFIG" -j
          ctest --test-dir cpp/build --build-config "$FOURDGS_CMAKE_CONFIG" \
            --output-on-failure --timeout 120

      - name: The example runs, so it cannot rot into a snippet that no longer works
        run: |
          ./cpp/build/examples/decode_summary \
            tests/conformance/data/OneWindow-UseChunkIndex-UseCrc-WithAudio.4dgs

      # The binding owns handles that come from across an FFI boundary, so a leak and a read
      # past the end of a buffer the ABI handed over are the two bugs it is exposed to. The
      # runners decode every corpus file here rather than the tests' synthetic data, because
      # an open/decode/close cycle over real files is what the sanitizers need to see.
      #
      # Linux only. The bugs this looks for — a leaked handle from across the FFI boundary,
      # a read past the end of a buffer the ABI handed over — are in the binding's own
      # logic, which is the same code on every platform, so one platform finds them. macOS
      # could run ASAN and Windows would need a different mechanism entirely; neither adds
      # a bug this leg would not already have caught.
      - name: Sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake -S cpp -B cpp/build-asan -DCMAKE_BUILD_TYPE=Debug -DFOURDGS_ASAN=ON
          cmake --build cpp/build-asan -j
          ctest --test-dir cpp/build-asan --output-on-failure
          # This step gates on memory, not on decoding: a sanitizer report exits 99 and fails
          # the job, while a decoder refusing a file exits 1 and is the conformance job's
          # business. Conflating the two would either hide a leak or make this job red for a
          # reason it cannot diagnose.
          for f in tests/conformance/data/*.4dgs; do
            ./cpp/build-asan/conformance/decode_streamed "$f" > /dev/null || {
              [ "$?" -eq 99 ] && { echo "::error::sanitizer report decoding $f"; exit 1; }
            }
          done
        env:
          ASAN_OPTIONS: detect_leaks=1:exitcode=99

  dart:
    # The decoder is pure Dart with no Flutter dependency, so this is a Dart SDK job and
    # not a Flutter one — and it runs on three operating systems for the reason every
    # other decoder does: the corpus is bytes, and a decoder that agrees with it on Linux
    # and disagrees on Windows is exactly the bug a conformance suite is for.
    name: ${{ matrix.os == 'ubuntu-latest' && 'dart' || format('dart ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The floor the package declares, not the newest SDK. A package whose CI only ever
      # ran on the latest Dart is a package whose lower bound is a guess.
      - uses: dart-lang/setup-dart@v1
        with: { sdk: "3.7" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: dart --version

      - name: Resolve
        run: |
          cd dart/fourdgs && dart pub get
          cd ../conformance && dart pub get

      # The front-matter tests decode real corpus files, which are generated
      # rather than committed. They fail rather than skip without one, so
      # generating it first is what stops them skipping themselves into a green
      # run that proved nothing.
      - name: Corpus
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py

      # Formatting and analysis read source and nothing else, so running them on three
      # operating systems would report the same answer three times.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed dart/fourdgs dart/conformance

      - name: Analyze
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dart/fourdgs && dart analyze --fatal-infos
          cd ../conformance && dart analyze --fatal-infos

      - name: Tests
        run: cd dart/fourdgs && dart test

      # The one gate that would otherwise be discovered on release day. It is cheap, it
      # needs no credentials, and a package that cannot be packed is a package whose first
      # publish fails in front of whoever is doing it by hand.
      - name: The package is publishable
        if: matrix.os == 'ubuntu-latest'
        run: cd dart/fourdgs && dart pub publish --dry-run

      # The version constant, the manifest and the changelog are three places one number
      # is written. The release workflow asserts the first two against the tag; this
      # asserts them against each other on every pull request, which is where a mismatch
      # is still cheap to fix.
      - name: The version constant matches the manifest
        if: matrix.os == 'ubuntu-latest'
        run: |
          manifest=$(grep -m1 '^version: ' dart/fourdgs/pubspec.yaml | cut -d' ' -f2)
          source=$(grep -m1 "^const String fourdgsPackageVersion = " dart/fourdgs/lib/fourdgs.dart | cut -d"'" -f2)
          echo "manifest=$manifest source=$source"
          if [ "$manifest" != "$source" ]; then
            echo "::error::version mismatch — pubspec.yaml $manifest, fourdgs.dart $source"
            exit 1
          fi

  swift:
    # The official Swift image rather than a toolchain-installer action: the job installs
    # nothing, and the version it builds against is a line in this file.
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Style comes from swift/.swift-format, so this is the same command a contributor
      # runs locally: `swift format --in-place --recursive` fixes what this reports.
      # Style comes from swift/.swift-format, so this is the same command a contributor
      # runs locally: `swift format --in-place --recursive` fixes what this reports.
      - name: Format
        run: swift format lint --recursive --strict swift/Sources swift/Tests swift/conformance

      # The toolchain and the core's build are cached separately on purpose: a Rust
      # source change should not throw away the compiler. On a hit the job fetches no
      # toolchain at all, which is the point — an unretried network dependency on the
      # critical path of two workflows is what took conformance red on its first run.
      - name: Cache the Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
          key: rust-toolchain-stable-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'Cargo.toml') }}
      - name: Cache the core's build
        uses: actions/cache@v4
        with:
          path: target
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml') }}
          restore-keys: rust-build-${{ runner.os }}-

      - name: Build the core
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential python3-numpy python3-pip >/dev/null
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "rust toolchain: restored from cache, nothing fetched"
          else
            echo "rust toolchain: cache miss, fetching rustup"
            curl -sSf --retry 5 --retry-all-errors --retry-delay 3 https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain stable
          fi
          # PATH rather than sourcing ~/.cargo/env: that file lives beside the cached
          # directories, not inside them, so on a cache hit it does not exist. Depending on
          # rustup's layout is what broke the hit path the first time this ran.
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build -p fourdgs --release
          ls -l target/release/libfourdgs.a

      # SPM links a system library by name, so the staticlib's directory has to be on the
      # linker's search path. It is passed here rather than written into Package.swift as
      # an unsafe flag, which would make the package undependable as a versioned dependency.
      # `cargo` emits libfourdgs.a and libfourdgs.so side by side, and the linker prefers
      # the shared one. That is fine — but then everything that runs needs it on the
      # loader's path too, which is what LD_LIBRARY_PATH is for. Apple platforms link the
      # staticlib and need no equivalent.
      - name: Build
        run: swift build --package-path swift -Xlinker -L$PWD/target/release
      - name: Tests
        run: LD_LIBRARY_PATH=$PWD/target/release swift test --package-path swift -Xlinker -L$PWD/target/release

      # The canonical JSON is a contract between languages, and this is where Swift's half
      # of it is checked — against canonical.py, on a synthetic scene, with no decoding in
      # the way. It means a conformance mismatch is about the decode and nothing else.
      - name: Canonical JSON agrees with canonical.py
        run: |
          LD_LIBRARY_PATH=$PWD/target/release swift run --package-path swift \
            -Xlinker -L$PWD/target/release canonical_selftest > /tmp/swift.json
          python3 swift/conformance/selftest.py --compare /tmp/swift.json

      # End to end over the ABI, on a real file, by both read paths. The conformance
      # workflow runs the full corpus; this is the fast check that the binding still
      # decodes at all, so a break shows up in the job that owns the package.
      - name: Decode a real file through the C ABI
        # bash for process substitution below; the container's default shell is sh.
        shell: bash
        run: |
          python3 -m pip install --break-system-packages -e ./python/fourdgs >/dev/null
          python3 tests/conformance/generate.py >/dev/null
          swift build --package-path swift --configuration release -Xlinker -L$PWD/target/release
          variant=$(ls tests/conformance/data/*UseChunkIndex*.4dgs | head -1)
          echo "decoding $variant"
          export LD_LIBRARY_PATH=$PWD/target/release
          ./swift/.build/release/decode_streamed "$variant" > /tmp/streamed.json
          ./swift/.build/release/decode_indexed "$variant" > /tmp/indexed.json
          # The two paths must agree. As far as this suite is concerned they are separate
          # decoders, and a difference between them is the bug the pair exists to find.
          diff <(python3 -m json.tool --sort-keys /tmp/streamed.json) \
               <(python3 -m json.tool --sort-keys /tmp/indexed.json) \
            || { echo "::error::the streamed and indexed read paths disagree"; exit 1; }
          echo "both read paths agree"

  swift-darwin:
    # visionOS and iOS are the platforms this package exists for, and a Linux build proves
    # nothing about either. The macOS runner is where the platform declarations in
    # Package.swift meet a real SDK — and, now that the package links the core, where the
    # Rust staticlib is proved to cross-compile for those platforms at all.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # No cache here, and that is a measured decision rather than an oversight. The
      # macOS runner already ships Rust, so there is no toolchain to fetch, and the crate
      # builds in about four seconds per target. Caching it cost 13s to save and returned
      # nothing: the whole job runs in under 70s. The Linux container is the only place
      # the cache pays, because that is the only place a toolchain has to be downloaded.
      - name: Build the core for macOS, visionOS and iOS
        run: |
          rustup target add aarch64-apple-visionos aarch64-apple-ios
          cargo build -p fourdgs --release
          cargo build -p fourdgs --release --target aarch64-apple-visionos
          cargo build -p fourdgs --release --target aarch64-apple-ios
      - name: Build for macOS
        run: swift build --package-path swift -Xlinker -L$PWD/target/release
      - name: Build for visionOS and iOS
        run: |
          set -e
          root="$PWD"
          cd swift
          for spec in "visionOS aarch64-apple-visionos" "iOS aarch64-apple-ios"; do
            set -- $spec
            echo "::group::$1"
            xcodebuild -scheme FourDGS -destination "generic/platform=$1" \
              -skipPackagePluginValidation \
              OTHER_LDFLAGS="-L$root/target/$2/release" build | tail -5
            echo "::endgroup::"
          done
