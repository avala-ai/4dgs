name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    # Regenerates the corpus, asserts the committed checksums, and asserts that two
    # generator runs are byte-identical — the check that catches nondeterminism in an
    # encoder before it becomes somebody else's failing CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py --verify

  python:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner python

  typescript:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the runners
        run: |
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # `run.py --runner typescript` fails if no TypeScript runner executed, so a
      # build that silently produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner typescript

  kaitai:
    # The .ksy grammar is an executable restatement of the spec: if it stops parsing the
    # corpus, the spec and the implementation have diverged.
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled with the grammar
    steps:
      - uses: actions/checkout@v4
      - run: echo "kaitai struct validation"

  rust:
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled when the Rust implementation lands
    steps:
      - uses: actions/checkout@v4
      - run: echo "rust conformance runner"

  cpp:
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled when the binding has a core behind it
  swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    needs: corpus
    # Enabled when the Swift package decodes: its seam onto the Rust core's C ABI is
    # unimplemented, so every runner would exit non-zero on every variant. Turning this on
    # is the milestone, and the feature matrix moves with it and not before.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the core, then the binding
        run: |
          cargo build -p fourdgs --release
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j
      # `run.py --runner cpp` fails if no C++ runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner cpp
      # `run.py --runner swift` fails if no Swift runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          swift build --package-path swift --configuration release
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner swift
