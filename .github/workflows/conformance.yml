name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    # Regenerates the corpus, asserts the committed checksums and expectations, and
    # asserts that two generator runs are byte-identical — the check that catches
    # nondeterminism in an encoder before it becomes somebody else's failing CI.
    #
    # `test_verify.py` is the gate's own test suite: it plants the mutations `--verify`
    # exists to catch — a signed zero, an expectation no variant produces — in a corpus of
    # its own and requires the gate to go red. A gate nobody tests is a gate that passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e './python/fourdgs[dev]'
          python -m pytest tests/conformance/test_verify.py -q
          python tests/conformance/generate.py --verify

  python:
    # The corpus is bytes, and a decoder that agrees with it on Linux and disagrees on
    # Windows is exactly the bug a conformance suite is for. The ubuntu leg keeps the
    # bare job name; the others are suffixed.
    name: ${{ matrix.os == 'ubuntu-latest' && 'python' || format('python ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner python

  typescript:
    name: ${{ matrix.os == 'ubuntu-latest' && 'typescript' || format('typescript ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the runners
        run: |
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # `run.py --runner typescript` fails if no TypeScript runner executed, so a
      # build that silently produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner typescript

  typescript-encode:
    # TypeScript is a genuine second encoder, not a binding, so its output is diffed against
    # the Rust reference on decoded content — the gaussian values, the chunk intervals, the
    # statistics, the SH digest — with the byte-layout fields two encoders may legitimately
    # differ on set aside. One ubuntu leg: the claim is cross-implementation agreement, which
    # a second operating system does not strengthen, and the reference is a Rust binary that
    # ubuntu-latest already has a toolchain for.
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the TypeScript runner and the Rust reference
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          cargo build -p fourdgs-conformance --release
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/encode_roundtrip.py --encoder typescript

      # The gaussian-birth gate above proves two encoders agree; it cannot prove either one
      # preserved the scene, because a fault present in both passes it (#189). The
      # keyframe-delta writer has no second encoder here at all, so its gate makes the
      # fidelity claim directly — the written file, read back by Python, against the
      # population that went in and the bounds the file itself declares — before it makes
      # any agreement claim.
      - name: keyframe-delta encode
        run: typescript/keyframe-delta-roundtrip.sh

  kaitai:
    # The .ksy grammar is an executable restatement of the spec: if it stops parsing the
    # corpus, the spec and the implementation have diverged.
    #
    # This job was a disabled placeholder until `kaitai/fourdgs.ksy` existed, because
    # deleting its `if: false` without the grammar would have produced a green job that
    # validated nothing. The three pieces of work its comment named — the grammar, a step
    # that installs the compiler and a runtime, and a pass over every corpus variant that
    # fails on the first one that does not parse — are what the steps below now do.
    #
    # The runner does more than parse, and it has to: a fixed-size record substream lets
    # an unconsumed remainder pass silently, which is the same leniency that makes
    # appended fields work (§4.2). So it also diffs what the grammar reads against each
    # variant's committed `.json` expectation. See kaitai/parse_corpus.py.
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Both versions are pinned for the same reason ruff is: a compiler that floats is a
      # job that turns red without anyone changing a line. The compiler is a JVM
      # application and ubuntu-latest ships a JDK, so nothing else is installed for it.
      - name: Install the Kaitai Struct compiler and runtime
        env:
          KSC_VERSION: "0.10"
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/ksc.zip \
            "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/kaitai-struct-compiler-${KSC_VERSION}.zip"
          unzip -q /tmp/ksc.zip -d /opt
          echo "/opt/kaitai-struct-compiler-${KSC_VERSION}/bin" >> "$GITHUB_PATH"
          pip install kaitaistruct==0.10
      - run: kaitai-struct-compiler --version

      - name: The grammar parses every corpus variant
        run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python kaitai/parse_corpus.py

  rust:
    name: ${{ matrix.os == 'ubuntu-latest' && 'rust' || format('rust ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    needs: corpus
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the runners
        run: cargo build --workspace --release
      # `run.py --runner rust` fails if no Rust runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner rust

      # One Ubuntu leg runs the shared source-fidelity gate over both reference encoders.
      # Agreement alone cannot expose a defect they share, which is the motivating failure
      # mode for this gate; its self-test runs beside them so a dead assertion is red too.
      - name: The two reference encoders preserve their source scenes
        if: matrix.os == 'ubuntu-latest'
        run: |
          python tests/conformance/encode_roundtrip.py --self-test
          python tests/conformance/encode_roundtrip.py --encoder rust
          python tests/conformance/encode_roundtrip.py --encoder python

      # Keep the existing cross-platform Rust/Python agreement pass on the other legs. Its
      # independent script exercises both read paths and remains useful platform coverage.
      - name: The encoder writes files another implementation agrees with
        if: matrix.os != 'ubuntu-latest'
        run: rust/encode-roundtrip.sh

  cpp:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the core, then the binding
        run: |
          cargo build -p fourdgs --release
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j
      # `run.py --runner cpp` fails if no C++ runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner cpp

      # The other direction: the binding re-encodes each variant's gaussians through the
      # core's writer, and the gate requires the Python decoder to read the result identically
      # to the Rust reference's encode of the same input — proving the C ABI encode was wired
      # through correctly. The Rust workspace build supplies the reference encoder.
      - name: The binding encodes files the reference agrees with
        run: |
          cargo build -p fourdgs-conformance --release
          python tests/conformance/encode_roundtrip.py --encoder cpp

      # keyframe-delta is the other encode surface, and the gate above cannot reach it: it
      # re-encodes a corpus variant's decoded gaussians, and a keyframe-delta file yields no
      # decoded sample sequence to hand back to a writer. Its own script synthesizes one and
      # makes four claims about every file — fidelity against the population that went in,
      # agreement between the C++ and Python decoders, the index's own counts, and byte
      # identity with the Rust reference writer, which is what a binding's claim actually is.
      - name: The binding encodes keyframe-delta sequences the reference agrees with
        run: cpp/keyframe-delta-roundtrip.sh

  dart:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: "3.13.1" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Compiled rather than run from source. `run.py` finds a runner by testing its
      # path for existence, and a .dart script always exists — so `dart run` would
      # make a machine with no Dart SDK report 67 failures instead of a skip.
      - name: Build the runners
        run: |
          cd dart/conformance
          dart pub get
          mkdir -p build
          dart compile exe bin/decode_streamed.dart -o build/decode_streamed
          dart compile exe bin/decode_indexed.dart -o build/decode_indexed
          dart compile exe bin/encode_roundtrip.dart -o build/encode_roundtrip
          dart compile exe bin/encode_keyframe_delta.dart -o build/encode_keyframe_delta
      # `run.py --runner dart` fails if no Dart runner executed, so a build that
      # silently produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner dart

      # The other direction: Dart writes gaussian and keyframe-delta scenes, and three
      # decoders — its own, the Python reference and the Rust reference — have to read the
      # result as the same scene on both read paths. The keyframe-delta pass also checks
      # every lane against the written file's declared bounds and compares the corpus
      # sequences with expectations produced by Python. Every reader is required.
      - name: Dart encodes files the Python and Rust references agree with
        run: |
          cargo build -p fourdgs-conformance --release
          dart/encode-roundtrip.sh
          python tests/conformance/encode_roundtrip.py --encoder dart

  swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      # The toolchain and the core's build are cached separately on purpose: a Rust
      # source change should not throw away the compiler. On a hit the job fetches no
      # toolchain at all, which is the point — an unretried network dependency on the
      # critical path of two workflows is what took conformance red on its first run.
      - name: Cache the Rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.rustup
          key: rust-toolchain-stable-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'Cargo.toml') }}
      - name: Cache the core's build
        uses: actions/cache@v6
        with:
          path: target
          key: rust-build-${{ runner.os }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml') }}
          restore-keys: rust-build-${{ runner.os }}-

      - name: Build the core
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential python3-pip >/dev/null
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "rust toolchain: restored from cache, nothing fetched"
          else
            echo "rust toolchain: cache miss, fetching rustup"
            curl -sSf --retry 5 --retry-all-errors --retry-delay 3 https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain stable
          fi
          # PATH rather than sourcing ~/.cargo/env: that file lives beside the cached
          # directories, not inside them, so on a cache hit it does not exist. Depending on
          # rustup's layout is what broke the hit path the first time this ran.
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build -p fourdgs --release
      # `run.py --runner swift` fails if no Swift runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one. LD_LIBRARY_PATH is needed
      # because cargo emits the staticlib and the cdylib side by side and the linker
      # prefers the shared one.
      #
      # The manifest is at the repository root (SwiftPM only finds it there), so there is
      # no --package-path; --scratch-path is what keeps the runners at the path run.py
      # looks them up by, swift/.build/release.
      - run: |
          swift build --scratch-path swift/.build --configuration release -Xlinker -L$PWD/target/release
          python3 -m pip install --break-system-packages -e ./python/fourdgs >/dev/null
          python3 tests/conformance/generate.py
          LD_LIBRARY_PATH=$PWD/target/release python3 tests/conformance/run.py --runner swift

      # The other direction: the binding re-encodes each variant's gaussians through the
      # core's writer, and the gate requires the Python decoder to read the result identically
      # to the Rust reference's encode of the same input — proving the C ABI encode was wired
      # through correctly. The reference encoder is a workspace binary built here with the
      # cached toolchain.
      - name: The binding encodes files the reference agrees with
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build -p fourdgs-conformance --release
          LD_LIBRARY_PATH=$PWD/target/release python3 tests/conformance/encode_roundtrip.py --encoder swift

      # The gate above covers the gaussian-birth writer, where a second encoder exists to
      # diff against. keyframe-delta has none here, so its gate makes the claim against the
      # Python reference instead: files Swift writes, read back by Python and by Swift on
      # both paths, and — for the four sequences the corpus generator also builds — against
      # the committed corpus's population and geometry.
      - name: keyframe-delta encode
        run: LD_LIBRARY_PATH=$PWD/target/release swift/keyframe-delta-roundtrip.sh
