name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    # Regenerates the corpus, asserts the committed checksums, and asserts that two
    # generator runs are byte-identical — the check that catches nondeterminism in an
    # encoder before it becomes somebody else's failing CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py --verify

  python:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner python

  typescript:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the runners
        run: |
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # `run.py --runner typescript` fails if no TypeScript runner executed, so a
      # build that silently produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner typescript

  kaitai:
    # The .ksy grammar is an executable restatement of the spec: if it stops parsing the
    # corpus, the spec and the implementation have diverged.
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled with the grammar
    steps:
      - uses: actions/checkout@v4
      - run: echo "kaitai struct validation"

  rust:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the runners
        run: cargo build --workspace --release
      # `run.py --runner rust` fails if no Rust runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner rust

      # The corpus proves decoders against files the reference encoder wrote; this proves
      # the Rust encoder, by requiring the Rust and Python decoders to agree on files it
      # wrote. An encoder checked only by its own decoder proves that two halves of one
      # implementation share an opinion, which is the failure mode this suite exists to
      # catch. Every encode inside it also runs the encoder's own bound verification.
      - name: The encoder writes files another implementation agrees with
        run: rust/encode-roundtrip.sh

  cpp:
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled when the binding has a core behind it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the core, then the binding
        run: |
          cargo build -p fourdgs --release
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j
      # `run.py --runner cpp` fails if no C++ runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one.
      - run: |
          pip install -e ./python/fourdgs
          python tests/conformance/generate.py
          python tests/conformance/run.py --runner cpp

  swift:
    runs-on: ubuntu-latest
    container: swift:6.1
    needs: corpus
    # Enabled when the C ABI can reach the non-gaussian records. The binding decodes
    # today, but the canonical summary covers what a file says and not only its gaussians,
    # so the runners refuse to emit a partial one and every variant would fail. Deleting
    # this line is the milestone, and the feature matrix moves with it and not before.
    #
    # Everything below is otherwise the real invocation and is meant to be correct now:
    # a job that only becomes true on the day it is enabled is a job nobody has tested.
    if: false
    steps:
      - uses: actions/checkout@v4
      # The Swift package is a binding, so the core has to exist before it links. The
      # image carries neither Rust nor pip, so the job installs what it runs.
      - name: Build the core
        run: |
          apt-get update -qq && apt-get install -y -qq curl build-essential python3-pip >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo build -p fourdgs --release
      # `run.py --runner swift` fails if no Swift runner executed, so a build that silently
      # produced nothing is a red suite rather than a green one. LD_LIBRARY_PATH is needed
      # because cargo emits the staticlib and the cdylib side by side and the linker
      # prefers the shared one.
      - run: |
          swift build --package-path swift --configuration release -Xlinker -L$PWD/target/release
          python3 -m pip install --break-system-packages -e ./python/fourdgs >/dev/null
          python3 tests/conformance/generate.py
          LD_LIBRARY_PATH=$PWD/target/release python3 tests/conformance/run.py --runner swift
