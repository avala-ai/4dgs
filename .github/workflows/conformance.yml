name: Conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    # Regenerates the corpus, asserts the committed checksums, and asserts that two
    # generator runs are byte-identical — the check that catches nondeterminism in an
    # encoder before it becomes somebody else's failing CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          if [ -f python/fourdgs/pyproject.toml ]; then
            pip install -e ./python/fourdgs
            python tests/conformance/generate.py --verify
          else
            echo "encoder not landed yet; corpus generation skipped"
          fi

  python:
    runs-on: ubuntu-latest
    needs: corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          if [ -f python/fourdgs/pyproject.toml ]; then
            pip install -e ./python/fourdgs
            python tests/conformance/run.py --runner python
          else
            echo "python runner not landed yet"
          fi

  typescript:
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled with the TypeScript milestone
    steps:
      - uses: actions/checkout@v4
      - run: echo "typescript conformance runner"

  kaitai:
    # The .ksy grammar is an executable restatement of the spec: if it stops parsing the
    # corpus, the spec and the implementation have diverged.
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled with the grammar
    steps:
      - uses: actions/checkout@v4
      - run: echo "kaitai struct validation"

  rust:
    runs-on: ubuntu-latest
    needs: corpus
    if: false # enabled when the Rust implementation lands
    steps:
      - uses: actions/checkout@v4
      - run: echo "rust conformance runner"
