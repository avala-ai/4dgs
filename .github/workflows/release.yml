name: Release

# Publishing is tag-driven and per package. Nothing here fires on an ordinary
# push: every job is guarded on a tag matching that package's scheme, so a
# release is always something someone did on purpose.
#
# Tag scheme (see RELEASING.md):
#   releases/python/vX.Y.Z
#   releases/rust/vX.Y.Z
#   releases/typescript/<package>/vX.Y.Z
#
# Every job authenticates with OIDC trusted publishing. There are no stored
# registry tokens in this repository and there should never be one: a token in
# a secret is a credential that outlives the job it was created for.
#
# Every job also leaves a GitHub Release behind, with that version's changelog
# section as its body. A tag that publishes a package and leaves no release is a
# version nobody can read the reason for, and the two drift from there. The
# section is required: the check runs before the build, so a missing one stops
# the release while it can still be abandoned.

on:
  push:
    tags:
      - "releases/**"
  workflow_dispatch:

jobs:
  python:
    name: Publish 4dgs to PyPI
    if: startsWith(github.ref, 'refs/tags/releases/python/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The only permission a trusted-publishing job needs. No token, no secret.
      id-token: write
      # For the release step alone. Scoped to this job rather than the workflow,
      # so the token that publishes has no more reach than it did before.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        # Run before anything is built. A package whose version constant and tag
        # disagree is the one mistake that cannot be fixed after publication,
        # because the version number is the thing you cannot take back.
        run: |
          tag="${GITHUB_REF#refs/tags/releases/python/v}"
          manifest=$(grep -m1 '^version = ' python/fourdgs/pyproject.toml | cut -d'"' -f2)
          source=$(grep -m1 '^__version__ = ' python/fourdgs/fourdgs/__init__.py | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest source=$source"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$source" ]; then
            echo "::error::version mismatch — tag $tag, pyproject $manifest, __init__ $source"
            exit 1
          fi

      - name: Release notes from the changelog
        # Before the build as well, and for the same reason: the section is what
        # the release will say, and a version that has nothing written about it
        # should not reach a registry at all.
        run: |
          version="${GITHUB_REF#refs/tags/releases/python/v}"
          python scripts/changelog_section.py python/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`pip install fourdgs==$version\` | [PyPI](https://pypi.org/project/fourdgs/$version/) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/python/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build python/fourdgs --outdir dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: GitHub Release
        # After the publish, because a release that points at a version the
        # registry does not have is worse than no release at all. No assets: the
        # artifact of record is the one on the registry, published with its
        # provenance attestation, and a second copy here is a second thing to
        # keep true.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/releases/python/v}"
          # 0.x is a draft wire format; the release page should say so.
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "fourdgs (Python) $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  rust:
    name: Publish fourdgs to crates.io
    if: startsWith(github.ref, 'refs/tags/releases/rust/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      # For the release step alone, as in the Python job.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/releases/rust/v}"
          manifest=$(grep -m1 '^version = ' rust/fourdgs/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::version mismatch — tag $tag, Cargo.toml $manifest"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF#refs/tags/releases/rust/v}"
          python scripts/changelog_section.py rust/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`cargo add fourdgs@$version\` | [crates.io](https://crates.io/crates/fourdgs/$version) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/rust/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build
        run: cargo build --manifest-path rust/fourdgs/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --manifest-path rust/fourdgs/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/releases/rust/v}"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "fourdgs (Rust) $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  typescript:
    name: Publish an @4dgs package to npm
    # Disabled until the TypeScript packages are publishable.
    #
    # The repository's package manager is Yarn, and this job uses it for
    # everything except the publish itself. That split is deliberate rather
    # than sloppy: npm's trusted publishing is an OIDC token exchange the npm
    # CLI performs, and no other client implements it. Yarn can publish
    # (`yarn workspace <name> npm publish`), but only against a stored
    # npmAuthToken — which is the credential this repository refuses to have.
    # A token in a secret outlives the job that created it; an OIDC exchange
    # does not. So Yarn installs and builds, npm publishes.
    if: false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The only permission a trusted-publishing job needs. No token, no secret.
      id-token: write
      # For the release step alone, as in the Python job.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node 22.14 or newer, because that is what npm 11.5.1 needs, and 11.5.1
      # is the first npm that can exchange an OIDC token for a publish.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          tag="${rest##*/v}"
          manifest=$(node -p "require('./typescript/${package}/package.json').version")
          echo "package=$package tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::version mismatch — tag $tag, package.json $manifest"
            exit 1
          fi

      - name: Release notes from the changelog
        # The four packages version together and share one changelog, so the
        # section is looked up by version and the package name only names the
        # release.
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          version="${rest##*/v}"
          python scripts/changelog_section.py typescript/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`npm install @4dgs/$package@$version\` | [npm](https://www.npmjs.com/package/@4dgs/$package/v/$version) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/typescript/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build what is about to be published
        run: |
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Publish
        # No --provenance: under trusted publishing npm attests automatically,
        # and passing the flag is how a job ends up asking for provenance it is
        # not configured to produce. `repository.url` in each package.json must
        # match this repository exactly or the exchange is refused.
        run: |
          npm install -g npm@latest
          npm --version
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          npm publish --workspace "typescript/${rest%/v*}" --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          version="${rest##*/v}"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "@4dgs/$package $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
