name: Release

# Publishing is tag-driven and per package. Nothing here fires on an ordinary
# push: every job is guarded on a tag matching that package's scheme, so a
# release is always something someone did on purpose.
#
# Tag scheme (see RELEASING.md):
#   releases/python/vX.Y.Z
#   releases/rust/vX.Y.Z
#   releases/dart/vX.Y.Z
#   releases/typescript/<package>/vX.Y.Z
#
# Every job authenticates with OIDC trusted publishing. There are no stored
# registry tokens in this repository and there should never be one: a token in
# a secret is a credential that outlives the job it was created for.
#
# Every job also leaves a GitHub Release behind, with that version's changelog
# section as its body. A tag that publishes a package and leaves no release is a
# version nobody can read the reason for, and the two drift from there. The
# section is required: the check runs before the build, so a missing one stops
# the release while it can still be abandoned.

on:
  push:
    tags:
      - "releases/**"
  workflow_dispatch:

jobs:
  python:
    name: Publish 4dgs to PyPI
    if: startsWith(github.ref, 'refs/tags/releases/python/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The only permission a trusted-publishing job needs. No token, no secret.
      id-token: write
      # For the release step alone. Scoped to this job rather than the workflow,
      # so the token that publishes has no more reach than it did before.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        # Run before anything is built. A package whose version constant and tag
        # disagree is the one mistake that cannot be fixed after publication,
        # because the version number is the thing you cannot take back.
        run: |
          tag="${GITHUB_REF#refs/tags/releases/python/v}"
          manifest=$(grep -m1 '^version = ' python/fourdgs/pyproject.toml | cut -d'"' -f2)
          source=$(grep -m1 '^__version__ = ' python/fourdgs/fourdgs/__init__.py | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest source=$source"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$source" ]; then
            echo "::error::version mismatch — tag $tag, pyproject $manifest, __init__ $source"
            exit 1
          fi

      - name: Release notes from the changelog
        # Before the build as well, and for the same reason: the section is what
        # the release will say, and a version that has nothing written about it
        # should not reach a registry at all.
        run: |
          version="${GITHUB_REF#refs/tags/releases/python/v}"
          python scripts/changelog_section.py python/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`pip install fourdgs==$version\` | [PyPI](https://pypi.org/project/fourdgs/$version/) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/python/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build python/fourdgs --outdir dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: GitHub Release
        # After the publish, because a release that points at a version the
        # registry does not have is worse than no release at all. No assets: the
        # artifact of record is the one on the registry, published with its
        # provenance attestation, and a second copy here is a second thing to
        # keep true.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/releases/python/v}"
          # 0.x is a draft wire format; the release page should say so.
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "fourdgs (Python) $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  rust:
    name: Publish fourdgs to crates.io
    if: startsWith(github.ref, 'refs/tags/releases/rust/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      # For the release step alone, as in the Python job.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/releases/rust/v}"
          manifest=$(grep -m1 '^version = ' rust/fourdgs/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::version mismatch — tag $tag, Cargo.toml $manifest"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF#refs/tags/releases/rust/v}"
          python scripts/changelog_section.py rust/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`cargo add fourdgs@$version\` | [crates.io](https://crates.io/crates/fourdgs/$version) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/rust/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build
        run: cargo build --manifest-path rust/fourdgs/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --manifest-path rust/fourdgs/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/releases/rust/v}"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "fourdgs (Rust) $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  dart:
    name: Publish fourdgs to pub.dev
    # DISABLED ON PURPOSE — do not delete this gate without doing the two manual steps
    # below first, in this order.
    #
    # pub.dev will not accept an automated publish for a package that does not exist
    # yet. A brand-new package name must be claimed by a human running
    # `dart pub publish` from a machine logged in with a Google account; there is no
    # OIDC path to a first publish, because there is no package for a publisher to be
    # configured on. So:
    #
    #   1. `cd dart/fourdgs && dart pub publish` — by hand, once. This claims the
    #      `fourdgs` name and puts 0.1.0 on the registry.
    #   2. On pub.dev, open the package's Admin tab and enable **Automated
    #      publishing** for this repository, with the tag pattern
    #      `releases/dart/v{{version}}`. That is what makes the OIDC exchange below
    #      succeed; without it every run of this job fails authentication.
    #   3. Then, and only then, delete this `if: false`.
    #
    # Flipping the gate before step 2 produces a job that fails on every tag, which is
    # the failure this comment exists to prevent — it looks like a broken workflow
    # rather than a missing setting.
    #
    # The maintainer intends to take the package to **verified publisher** status under
    # the `4dgs.dev` domain, which is a separate pub.dev setting from automated
    # publishing and does not gate this job.
    if: false
    # if: startsWith(github.ref, 'refs/tags/releases/dart/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The only permission a trusted-publishing job needs. No token, no secret.
      id-token: write
      # For the release step alone, as in the Python job.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        # Three places one number is written, all checked before anything is built. A
        # package whose version and tag disagree is the one mistake that cannot be
        # fixed after publication.
        run: |
          tag="${GITHUB_REF#refs/tags/releases/dart/v}"
          manifest=$(grep -m1 '^version: ' dart/fourdgs/pubspec.yaml | cut -d' ' -f2)
          source=$(grep -m1 "^const String fourdgsPackageVersion = " dart/fourdgs/lib/fourdgs.dart | cut -d"'" -f2)
          echo "tag=$tag manifest=$manifest source=$source"
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$source" ]; then
            echo "::error::version mismatch — tag $tag, pubspec $manifest, fourdgs.dart $source"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF#refs/tags/releases/dart/v}"
          python scripts/changelog_section.py dart/fourdgs/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`dart pub add fourdgs:$version\` | [pub.dev](https://pub.dev/packages/fourdgs/versions/$version) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/dart/fourdgs/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build what is about to be published
        run: |
          cd dart/fourdgs
          dart pub get
          dart analyze --fatal-infos
          dart test
          dart pub publish --dry-run

      - name: Publish
        # No token: `dart pub publish --force` uses the OIDC identity pub.dev's
        # automated-publishing setting is configured to trust. `--force` skips the
        # interactive confirmation, not any of the validation.
        run: cd dart/fourdgs && dart pub publish --force

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF#refs/tags/releases/dart/v}"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "fourdgs (Dart) $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

  typescript:
    name: Publish an @4dgs package to npm
    if: startsWith(github.ref, 'refs/tags/releases/typescript/')
    # The repository's package manager is Yarn, and this job uses it for
    # everything except the publish itself. That split is deliberate rather
    # than sloppy: npm's trusted publishing is an OIDC token exchange the npm
    # CLI performs, and no other client implements it. Yarn can publish
    # (`yarn workspace <name> npm publish`), but only against a stored
    # npmAuthToken — which is the credential this repository refuses to have.
    # A token in a secret outlives the job that created it; an OIDC exchange
    # does not. So Yarn installs and builds, npm publishes.
    #
    # One consequence of that split is handled explicitly below: npm packs
    # `workspace:^` dependency ranges verbatim (verified against npm 12.0.1),
    # so without the resolve step this job would publish tarballs no
    # consumer's npm can install — and it would do so with a green run.
    #
    # First real release must version past 0.0.1: the placeholder publishes
    # that claimed the @4dgs scope sit at 0.0.1 on the registry, and npm
    # refuses to tag a lower version as latest.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The only permission a trusted-publishing job needs. No token, no secret.
      id-token: write
      # For the release step alone, as in the Python job.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Node 22.14 or newer, because that is what npm 11.5.1 needs, and 11.5.1
      # is the first npm that can exchange an OIDC token for a publish.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version matches the tag
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          tag="${rest##*/v}"
          manifest=$(node -p "require('./typescript/${package}/package.json').version")
          echo "package=$package tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::version mismatch — tag $tag, package.json $manifest"
            exit 1
          fi

      - name: Release notes from the changelog
        # The four packages version together and share one changelog, so the
        # section is looked up by version and the package name only names the
        # release.
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          version="${rest##*/v}"
          python scripts/changelog_section.py typescript/CHANGELOG.md "$version" > "$RUNNER_TEMP/section.md"
          {
            echo "## What's changed"
            echo
            cat "$RUNNER_TEMP/section.md"
            echo
            echo "---"
            echo
            echo "\`npm install @4dgs/$package@$version\` | [npm](https://www.npmjs.com/package/@4dgs/$package/v/$version) | [full changelog](https://github.com/avala-ai/4dgs/blob/main/typescript/CHANGELOG.md)"
          } > "$RUNNER_TEMP/notes.md"

      - name: Build what is about to be published
        run: |
          corepack enable
          yarn install --immutable
          yarn build
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Resolve workspace ranges to the release version
        # Yarn understands `workspace:^`; npm does not, and `npm pack` puts
        # the specifier into the tarball untranslated. The four packages
        # version together, so every internal range resolves to the version
        # being tagged. This rewrites the manifests in the runner's checkout
        # only — the repository keeps the workspace ranges.
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          version="${rest##*/v}"
          node - "$version" <<'EOF'
          const fs = require("fs");
          const version = process.argv[2];
          for (const dir of fs.readdirSync("typescript", { withFileTypes: true })) {
            const path = `typescript/${dir.name}/package.json`;
            if (!dir.isDirectory() || !fs.existsSync(path)) continue;
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            let changed = false;
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, range] of Object.entries(manifest[field] ?? {})) {
                if (!range.startsWith("workspace:")) continue;
                manifest[field][name] = `^${version}`;
                changed = true;
              }
            }
            if (!changed) continue;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
            console.log(`${path}: workspace ranges -> ^${version}`);
          }
          EOF

      - name: No workspace range survives into the tarball
        # The proof the step above worked, taken from the artifact itself
        # rather than the manifest: pack the package about to be published
        # and refuse if the specifier npm cannot install is still inside.
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          tarball=$(cd "typescript/$package" && npm pack --silent)
          if tar -xzOf "typescript/$package/$tarball" package/package.json | grep -q '"workspace:'; then
            echo "::error::the packed manifest still carries a workspace: range — publishing it would ship an uninstallable package"
            exit 1
          fi
          rm "typescript/$package/$tarball"

      - name: Publish
        # No --provenance: under trusted publishing npm attests automatically,
        # and passing the flag is how a job ends up asking for provenance it is
        # not configured to produce. `repository.url` in each package.json must
        # match this repository exactly or the exchange is refused.
        #
        # --loglevel verbose is not debugging left behind. npm's OIDC exchange
        # is best-effort by design: every way it can fail returns quietly and
        # publishing continues unauthenticated, so a missing or mismatched
        # trusted publisher arrives as `404 PUT` with no mention of OIDC
        # anywhere in the log. The reasons are logged, at verbose. This is the
        # one step in this workflow whose failure mode is silent, so it is the
        # one step that asks for the volume.
        run: |
          npm install -g npm@latest
          npm --version
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          npm publish --workspace "typescript/${rest%/v*}" --access public --loglevel verbose

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rest="${GITHUB_REF#refs/tags/releases/typescript/}"
          package="${rest%/v*}"
          version="${rest##*/v}"
          case "$version" in 0.*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "${GITHUB_REF#refs/tags/}" $prerelease \
            --title "@4dgs/$package $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
